name: Deploy GitHub Pages (gh-pages branch)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,create_pca_plot_3d_interactive.py,MANUSCRIPT_CITATION.txt,README.md,Cluster_Separation_PCA_3D_interactive.html'
          publish_branch: gh-pages
          force_orphan: true
